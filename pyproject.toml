[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medxfair"
version = "0.4.0"
description = "Diagnosis-first intersectional auditing of binary clinical predictions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "scikit-learn>=1.2"]

[project.optional-dependencies]
explain = ["shap>=0.44"]
dev = ["pytest>=7", "build>=1", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
